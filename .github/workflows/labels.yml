# Sync GitHub Labels
# Uses github-labelmanager to sync labels from .github/labels.yml
# https://github.com/kjanat/github-labelmanager

name: Sync Labels

on:
  push:
    branches: [master]
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync labels
        uses: kjanat/github-labelmanager@611e47cf63c91530ded1c82400ca45f265b7c2dd # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
